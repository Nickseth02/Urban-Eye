<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban-Eye — Command Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#0a0e1a; color:#e0e6f0;
  font-family:'Courier New',monospace;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

header {
  background:#0d1224; border-bottom:2px solid #1e3a5f;
  padding:10px 20px; display:flex; align-items:center;
  justify-content:space-between; flex-shrink:0;
}
header h1  { font-size:15px; color:#4fc3f7; letter-spacing:2px; text-transform:uppercase; }
#sys-status { font-size:12px; color:#4caf50; animation:blink 2s infinite; }
#sys-offline { font-size:12px; color:#f44336; display:none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
#clock { font-size:13px; color:#90caf9; }

.main { display:flex; flex:1; overflow:hidden; position:relative; }
#map  { flex:1; }

/* ── Map layer toggles ── */
.map-controls {
  position:absolute; top:70px; left:10px; z-index:1000;
  display:flex; flex-direction:column; gap:6px;
}
.map-btn {
  padding:6px 12px; background:#0d1224ee;
  border:1px solid #1e3a5f; color:#90caf9;
  font-size:11px; border-radius:4px; cursor:pointer;
  font-family:'Courier New',monospace; transition:all .2s;
}
.map-btn:hover { border-color:#4fc3f7; color:#4fc3f7; }
.map-btn.active { border-color:#4fc3f7; color:#4fc3f7; background:#1a3a5fdd; }

/* ── Side panel ── */
.panel {
  width:360px; background:#0d1224;
  border-left:1px solid #1e3a5f;
  display:flex; flex-direction:column; overflow:hidden;
}

.tabs { display:flex; border-bottom:1px solid #1e3a5f; flex-shrink:0; }
.tab {
  flex:1; padding:8px; text-align:center; font-size:10px;
  letter-spacing:1px; text-transform:uppercase; cursor:pointer;
  color:#546e7a; border-bottom:2px solid transparent; transition:all .2s;
}
.tab.active { color:#4fc3f7; border-bottom-color:#4fc3f7; background:#111827; }
.tab:hover  { color:#90caf9; }

.tab-content { display:none; flex:1; overflow-y:auto; padding:12px; }
.tab-content.active { display:flex; flex-direction:column; }

/* ── Drone cards ── */
.drone-card {
  background:#111827; border:1px solid #1e3a5f;
  border-radius:4px; padding:10px; margin-bottom:8px; font-size:12px;
}
.drone-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.drone-id     { color:#4fc3f7; font-weight:bold; font-size:13px; }

.status-badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; text-transform:uppercase; }
.status-idle       { background:#1a3a1a; color:#4caf50; border:1px solid #4caf50; }
.status-dispatched { background:#3a1a00; color:#ff9800; border:1px solid #ff9800; }
.status-onsite     { background:#3a0000; color:#f44336; border:1px solid #f44336; }
.status-returning  { background:#1a1a3a; color:#9c27b0; border:1px solid #9c27b0; }

.drone-coords { color:#546e7a; font-size:10px; margin-bottom:4px; }
.battery-row  { display:flex; align-items:center; gap:8px; }
.battery-bar  { flex:1; height:5px; background:#1e3a5f; border-radius:3px; }
.battery-fill { height:100%; border-radius:3px; transition:width 1s; }
.battery-text { font-size:10px; color:#90caf9; min-width:35px; }

/* ── Alert cards ── */
.alert-card {
  background:#111827; border-radius:4px; padding:10px; margin-bottom:8px;
  font-size:12px; cursor:pointer; border-left:4px solid #546e7a;
  transition:background .2s;
}
.alert-card:hover     { background:#1a2640; }
.alert-header         { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
.alert-type           { font-weight:bold; font-size:11px; text-transform:uppercase; }
.severity-badge       { padding:1px 6px; border-radius:3px; font-size:9px; font-weight:bold; border:1px solid currentColor; }
.alert-meta           { color:#546e7a; font-size:10px; line-height:1.6; }
.alert-camera         { color:#4fc3f7; font-size:10px; margin-top:3px; }
.reasons              { font-size:9px; color:#546e7a; margin-top:4px; border-top:1px solid #1e3a5f; padding-top:4px; }

.dispatch-btn {
  margin-top:7px; padding:4px 12px; background:#1a3a5f;
  border:1px solid #4fc3f7; color:#4fc3f7; font-size:10px;
  border-radius:3px; cursor:pointer; font-family:'Courier New',monospace;
  transition:all .2s; width:100%;
}
.dispatch-btn:hover:not(:disabled) { background:#4fc3f7; color:#0a0e1a; }
.dispatch-btn:disabled { opacity:.4; cursor:not-allowed; }

/* ── Filter bar ── */
.filter-bar {
  padding:8px 0; border-bottom:1px solid #1e3a5f;
  display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;
}
.filter-btn {
  padding:2px 8px; border-radius:10px; font-size:10px; cursor:pointer;
  border:1px solid #1e3a5f; background:transparent; color:#546e7a;
  font-family:'Courier New',monospace; transition:all .2s;
}
.filter-btn.active { border-color:#4fc3f7; color:#4fc3f7; background:#111827; }

/* ── Stats bar ── */
.stats-bar {
  background:#0d1224; border-top:1px solid #1e3a5f;
  padding:8px 20px; display:flex; gap:20px; flex-shrink:0;
}
.stat       { display:flex; flex-direction:column; align-items:center; }
.stat-value { font-size:18px; font-weight:bold; color:#4fc3f7; }
.stat-label { color:#546e7a; font-size:9px; text-transform:uppercase; letter-spacing:1px; }

/* ── Log ── */
#event-log { font-size:10px; color:#546e7a; line-height:2; }

::-webkit-scrollbar       { width:4px; }
::-webkit-scrollbar-track { background:#0a0e1a; }
::-webkit-scrollbar-thumb { background:#1e3a5f; border-radius:2px; }
</style>
</head>
<body>

<header>
  <h1>⬡ Urban-Eye — Command Center</h1>
  <div>
    <span id="sys-status">● SYSTEM ONLINE</span>
    <span id="sys-offline">● API OFFLINE</span>
  </div>
  <span id="clock"></span>
</header>

<div class="main">
  <div id="map"></div>

  <div class="map-controls">
    <button class="map-btn active" id="btn-heatmap"   onclick="toggleLayer('heatmap')">🔥 Heatmap</button>
    <button class="map-btn active" id="btn-noflyzone" onclick="toggleLayer('noflyzone')">🚫 No-Fly Zones</button>
    <button class="map-btn active" id="btn-drones"    onclick="toggleLayer('drones')">⬡ Drones</button>
    <button class="map-btn active" id="btn-incidents" onclick="toggleLayer('incidents')">⚠ Incidents</button>
  </div>

  <div class="panel">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('drones')">⬡ Fleet</div>
      <div class="tab"        onclick="switchTab('alerts')">⚠ Alerts</div>
      <div class="tab"        onclick="switchTab('log')">📋 Log</div>
    </div>

    <div class="tab-content active" id="tab-drones">
      <div id="drone-list"></div>
    </div>

    <div class="tab-content" id="tab-alerts">
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="filter-btn"        onclick="setFilter('CRITICAL',this)">Critical</button>
        <button class="filter-btn"        onclick="setFilter('HIGH',this)">High</button>
        <button class="filter-btn"        onclick="setFilter('MEDIUM',this)">Medium</button>
        <button class="filter-btn"        onclick="setFilter('LOW',this)">Low</button>
      </div>
      <div id="alert-list" style="overflow-y:auto;flex:1;margin-top:8px;"></div>
    </div>

    <div class="tab-content" id="tab-log">
      <div id="event-log"></div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Total Alerts</span></div>
  <div class="stat"><span class="stat-value" id="stat-critical" style="color:#f44336">0</span><span class="stat-label">Critical</span></div>
  <div class="stat"><span class="stat-value" id="stat-high"     style="color:#ff9800">0</span><span class="stat-label">High</span></div>
  <div class="stat"><span class="stat-value" id="stat-active">0</span><span class="stat-label">Active Drones</span></div>
  <div class="stat"><span class="stat-value" id="stat-idle">0</span><span class="stat-label">Idle Drones</span></div>
</div>

<script>
const API           = "http://localhost:5050";
const POLL_DRONES   = 2000;   // ms
const POLL_ALERTS   = 4000;
const POLL_DISPATCH = 3000;

// ── State ──────────────────────────────────────────────────────────────────
let currentFilter   = "all";
let dispatchedAlerts = new Set();
let eventLog         = [];
let droneMarkers     = {};
let alertMarkers     = {};
let alertJitter      = {};   // stable per-alert jitter stored here
let heatLayer        = null;
let layerVisible     = { heatmap:true, noflyzone:true, drones:true, incidents:true };

// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map("map", { zoomControl:false }).setView([18.5204, 73.8567], 13);
L.control.zoom({ position:"bottomright" }).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:"© OpenStreetMap", maxZoom:18
}).addTo(map);

// ── No-fly zones ───────────────────────────────────────────────────────────
const NO_FLY_ZONES = [
  { name:"Airport Exclusion Zone",   coords:[[18.5819,73.9082],[18.5819,73.9282],[18.5619,73.9282],[18.5619,73.9082]] },
  { name:"Military Area — Restricted", coords:[[18.5050,73.8200],[18.5050,73.8350],[18.4900,73.8350],[18.4900,73.8200]] },
  { name:"Government Complex",       coords:[[18.5180,73.8560],[18.5180,73.8640],[18.5120,73.8640],[18.5120,73.8560]] },
];
const noFlyLayers = NO_FLY_ZONES.map(z =>
  L.polygon(z.coords, { color:"#f44336", fillColor:"#f44336", fillOpacity:.15, weight:2, dashArray:"6,4" })
   .bindTooltip(`🚫 ${z.name}`, { sticky:true })
   .addTo(map)
);

// ── Icons ──────────────────────────────────────────────────────────────────
function droneIcon(status) {
  const c = { idle:"#4caf50", dispatched:"#ff9800", "on-site":"#f44336", returning:"#9c27b0" }[status] || "#4fc3f7";
  return L.divIcon({
    html:`<div style="width:24px;height:24px;background:${c};border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 8px ${c}"></div>`,
    iconSize:[24,24], iconAnchor:[12,24], className:""
  });
}
function incidentIcon(type, color) {
  const e = { suspicious_vehicle:"🚗", potential_incident:"🚨", crowd_gathering:"👥", abandoned_object:"📦", collision_detected:"💥" };
  return L.divIcon({
    html:`<div style="font-size:22px;filter:drop-shadow(0 0 5px ${color})">${e[type]||"⚠️"}</div>`,
    iconSize:[28,28], iconAnchor:[14,14], className:""
  });
}

// ── Layer toggles ──────────────────────────────────────────────────────────
function toggleLayer(name) {
  layerVisible[name] = !layerVisible[name];
  document.getElementById(`btn-${name}`).classList.toggle("active", layerVisible[name]);

  if (name === "heatmap") {
    if (!layerVisible.heatmap && heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
  }
  if (name === "noflyzone") {
    noFlyLayers.forEach(l => layerVisible.noflyzone ? l.addTo(map) : map.removeLayer(l));
  }
  if (name === "drones") {
    Object.values(droneMarkers).forEach(m => layerVisible.drones ? m.addTo(map) : map.removeLayer(m));
  }
  if (name === "incidents") {
    Object.values(alertMarkers).forEach(m => layerVisible.incidents ? m.addTo(map) : map.removeLayer(m));
  }
}

// ── Clock ──────────────────────────────────────────────────────────────────
setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleTimeString(); }, 1000);

// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll(".tab").forEach((t,i) => {
    t.classList.toggle("active", ["drones","alerts","log"][i] === name);
  });
  document.querySelectorAll(".tab-content").forEach(c => {
    c.classList.toggle("active", c.id === `tab-${name}`);
  });
}

// ── Filter ─────────────────────────────────────────────────────────────────
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  if (window._lastAlerts) renderAlerts(window._lastAlerts);
}

// ── Log ────────────────────────────────────────────────────────────────────
function addLog(msg) {
  const t = new Date().toLocaleTimeString();
  eventLog.unshift(`<span style="color:#4fc3f7">${t}</span> ${msg}`);
  if (eventLog.length > 100) eventLog.pop();
  document.getElementById("event-log").innerHTML = eventLog.join("<br>");
}

// ── API health indicator ───────────────────────────────────────────────────
function setOnline(online) {
  document.getElementById("sys-status").style.display  = online ? "inline" : "none";
  document.getElementById("sys-offline").style.display = online ? "none"   : "inline";
}

// ── Fetch helpers ──────────────────────────────────────────────────────────
async function safeFetch(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setOnline(true);
    return await res.json();
  } catch (e) {
    setOnline(false);
    return null;
  }
}

// ── Drones ─────────────────────────────────────────────────────────────────
async function fetchDrones() {
  const data = await safeFetch(`${API}/drones`);
  if (data) renderDrones(data);
}

function renderDrones(drones) {
  const list = document.getElementById("drone-list");
  list.innerHTML = "";
  let active = 0, idle = 0;

  drones.forEach(drone => {
    drone.status !== "idle" ? active++ : idle++;

    if (droneMarkers[drone.id]) {
      droneMarkers[drone.id].setLatLng([drone.lat, drone.lng]);
      droneMarkers[drone.id].setIcon(droneIcon(drone.status));
    } else {
      droneMarkers[drone.id] = L.marker([drone.lat, drone.lng], { icon: droneIcon(drone.status) })
        .addTo(map)
        .bindTooltip(drone.name, { permanent:true, direction:"top", offset:[0,-8] });
    }
    if (!layerVisible.drones) map.removeLayer(droneMarkers[drone.id]);

    const batt      = Math.max(0, Math.min(100, drone.battery));
    const battColor = batt > 60 ? "#4caf50" : batt > 30 ? "#ff9800" : "#f44336";
    const statusCls = drone.status.replace("-","");

    list.innerHTML += `
      <div class="drone-card">
        <div class="drone-header">
          <span class="drone-id">⬡ ${drone.name}</span>
          <span class="status-badge status-${statusCls}">${drone.status}</span>
        </div>
        <div class="drone-coords">📍 ${drone.lat.toFixed(4)}, ${drone.lng.toFixed(4)}</div>
        <div class="battery-row">
          <div class="battery-bar"><div class="battery-fill" style="width:${batt}%;background:${battColor}"></div></div>
          <span class="battery-text">${batt.toFixed(0)}%</span>
        </div>
      </div>`;
  });

  document.getElementById("stat-active").textContent = active;
  document.getElementById("stat-idle").textContent   = idle;
}

// ── Alerts ─────────────────────────────────────────────────────────────────
async function fetchAlerts() {
  const data = await safeFetch(`${API}/alerts`);
  if (!data) return;
  window._lastAlerts = data;
  renderAlerts(data);
  updateHeatmap(data);
}

function renderAlerts(alerts) {
  const sorted   = [...alerts].sort((a,b) => (b.severity_score||0) - (a.severity_score||0));
  const filtered = currentFilter === "all"
    ? sorted
    : sorted.filter(a => a.severity_label === currentFilter);

  document.getElementById("stat-total").textContent    = alerts.length;
  document.getElementById("stat-critical").textContent = alerts.filter(a => a.severity_label === "CRITICAL").length;
  document.getElementById("stat-high").textContent     = alerts.filter(a => a.severity_label === "HIGH").length;

  // Place map markers — jitter is computed once per index and stored
  alerts.forEach((alert, index) => {
    if (!alertMarkers[index] && alert.lat && alert.lng) {
      // Stable jitter: compute once and cache
      if (!alertJitter[index]) {
        alertJitter[index] = {
          lat: (Math.random() * 0.006 - 0.003),
          lng: (Math.random() * 0.006 - 0.003),
        };
      }
      const jLat = alert.lat + alertJitter[index].lat;
      const jLng = alert.lng + alertJitter[index].lng;

      alertMarkers[index] = L.marker([jLat, jLng], {
        icon: incidentIcon(alert.type, alert.severity_color || "#ff9800")
      }).addTo(map).bindPopup(`
        <div style="font-family:monospace;font-size:12px;min-width:180px;">
          <b style="color:${alert.severity_color}">${alert.severity_label} — ${alert.type.replace(/_/g," ").toUpperCase()}</b><br>
          <hr style="border-color:#333;margin:4px 0">
          📷 ${alert.camera_name || "Unknown"}<br>
          🎯 Confidence: ${(alert.confidence * 100).toFixed(0)}%<br>
          📊 Severity: ${alert.severity_score}/10<br>
          🕐 ${new Date(alert.timestamp * 1000).toLocaleTimeString()}<br>
          <hr style="border-color:#333;margin:4px 0">
          <small style="color:#888">${(alert.severity_reasons||[]).join("<br>")}</small>
        </div>
      `);
      if (!layerVisible.incidents) map.removeLayer(alertMarkers[index]);
    }
  });

  const list = document.getElementById("alert-list");
  if (filtered.length === 0) {
    list.innerHTML = `<div style="color:#546e7a;text-align:center;margin-top:20px;font-size:11px;">No alerts matching filter</div>`;
    return;
  }

  list.innerHTML = "";
  filtered.forEach(alert => {
    const origIndex  = alerts.indexOf(alert);
    const dispatched = dispatchedAlerts.has(origIndex);
    const timeStr    = new Date(alert.timestamp * 1000).toLocaleTimeString();
    const sc         = alert.severity_color || "#ff9800";
    const sl         = alert.severity_label || "MEDIUM";

    list.innerHTML += `
      <div class="alert-card" style="border-left-color:${sc}" onclick="focusAlert(${origIndex})">
        <div class="alert-header">
          <span class="alert-type" style="color:${sc}">${alert.type.replace(/_/g," ")}</span>
          <span class="severity-badge" style="color:${sc}">${sl} ${alert.severity_score}/10</span>
        </div>
        <div class="alert-meta">Class: ${alert.class} | Conf: ${(alert.confidence*100).toFixed(0)}%</div>
        <div class="alert-camera">📷 ${alert.camera_name || "Unknown"} | ${alert.zone || ""}</div>
        <div class="alert-meta">🕐 ${timeStr} | Frame ${alert.frame}</div>
        <div class="reasons">${(alert.severity_reasons||[]).join(" · ")}</div>
        <button class="dispatch-btn" onclick="dispatch(event,${origIndex})"
          id="btn-${origIndex}" ${dispatched?"disabled":""}>
          ${dispatched ? "✓ DISPATCHED" : "⬡ DISPATCH DRONE"}
        </button>
      </div>`;
  });
}

// ── Focus on map ───────────────────────────────────────────────────────────
function focusAlert(index) {
  const m = alertMarkers[index];
  if (m) { map.setView(m.getLatLng(), 15, { animate:true }); m.openPopup(); }
}

// ── Heatmap ────────────────────────────────────────────────────────────────
function updateHeatmap(alerts) {
  if (!layerVisible.heatmap) return;
  const pts = alerts.map(a => [a.lat, a.lng, (a.severity_score || 5) / 10]);
  if (heatLayer) map.removeLayer(heatLayer);
  if (pts.length > 0) {
    heatLayer = L.heatLayer(pts, {
      radius:35, blur:25, maxZoom:16,
      gradient:{ 0.2:"#4caf50", 0.5:"#ff9800", 0.8:"#f44336", 1.0:"#9c27b0" }
    }).addTo(map);
  }
}

// ── Manual dispatch ────────────────────────────────────────────────────────
async function dispatch(event, index) {
  event.stopPropagation();
  const btn = document.getElementById(`btn-${index}`);
  btn.disabled    = true;
  btn.textContent = "DISPATCHING...";

  const data = await safeFetch(`${API}/dispatch/${index}`);
  if (data && data.drone_id) {
    dispatchedAlerts.add(index);
    btn.textContent = "✓ DISPATCHED";
    const dest = data.destination;
    L.polyline([[dest.lat + 0.008, dest.lng - 0.008],[dest.lat, dest.lng]],
      { color:"#ff9800", weight:2, dashArray:"6,4", opacity:.8 }).addTo(map);
    addLog(`${data.message} → ${data.incident.replace(/_/g," ")} | ETA:${data.eta_seconds}s | ${data.distance_km}km`);
  } else {
    btn.textContent = "✗ FAILED — RETRY";
    btn.disabled    = false;
  }
}

// ── Auto-dispatch ──────────────────────────────────────────────────────────
async function autoDispatch() {
  const data = await safeFetch(`${API}/auto_dispatch`);
  if (data && data.dispatched > 0) {
    addLog(`AUTO-DISPATCH: ${data.dispatched} drone(s) → critical alerts`);
    switchTab("drones");
    // Sync locally dispatched set with server
    const idx = await safeFetch(`${API}/dispatched_indices`);
    if (idx) idx.indices.forEach(i => dispatchedAlerts.add(i));
  }
}

// ── Polling ────────────────────────────────────────────────────────────────
fetchDrones();
fetchAlerts();
setInterval(fetchDrones,   POLL_DRONES);
setInterval(fetchAlerts,   POLL_ALERTS);
setInterval(autoDispatch,  POLL_DISPATCH);

addLog("Urban-Eye command center initialized");
addLog("All systems nominal");
</script>
</body>
</html>
